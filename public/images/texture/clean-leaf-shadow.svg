<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>
  <g filter="url(#shadow-blur)" fill="#786B59" opacity="0.18">
    <!-- Main stem -->
    <path d="M-20,-20 Q80,120 180,240 Q240,310 320,380" stroke="#786B59" stroke-width="6" fill="none" />
    <!-- Palm / eucalyptus leaves branching out -->
    <path d="M40,40 Q90,30 160,50 Q120,80 40,40 Z" />
    <path d="M70,80 Q140,70 220,100 Q160,130 70,80 Z" />
    <path d="M100,130 Q180,110 260,140 Q200,180 100,130 Z" />
    <path d="M130,180 Q220,160 300,190 Q240,230 130,180 Z" />
    <path d="M160,230 Q250,220 330,250 Q260,290 160,230 Z" />
    <path d="M190,280 Q270,270 340,300 Q280,330 190,280 Z" />
    <path d="M220,330 Q290,320 350,350 Q300,380 220,330 Z" />
    <!-- Secondary delicate branches -->
    <path d="M20,90 Q-10,140 -40,190 Q10,160 20,90 Z" />
    <path d="M50,150 Q10,210 -20,270 Q40,220 50,150 Z" />
    <path d="M80,210 Q40,280 10,340 Q70,280 80,210 Z" />
  </g>
</svg>

